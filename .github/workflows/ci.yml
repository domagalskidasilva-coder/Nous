name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Bibliotecas do sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libvulkan-dev

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      - name: Testes
        run: cargo test --workspace

      - name: Build release
        run: cargo build --release -p nous-app

      - name: Publicar binário
        uses: actions/upload-artifact@v4
        with:
          name: nous-${{ runner.os }}
          path: |
            target/release/nous
            target/release/nous.exe
          if-no-files-found: error
